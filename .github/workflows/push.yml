name: "Verify npm trusted publishing"

# One-time test for INT-2237. Same filename as the real release workflow, because npm
# matches the trusted publisher on the workflow filename, not on the branch.
on:
  workflow_dispatch:

concurrency:
  group: int-2237-oidc-pilot
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/ci/INT-2237-oidc-pilot'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: "Prepare beta versions for all packages"
        run: |
          pnpm nx release version prerelease --preid beta-oidc \
            --git-commit=false --git-tag=false --git-push=false --stage-changes=false

      - name: "Build packages"
        run: pnpm build --output-style static

      # No token in ~/.npmrc: the publish succeeds only through OIDC.
      - name: "Publish the OIDC beta versions"
        run: pnpm -r publish --no-git-checks --tag beta-oidc
